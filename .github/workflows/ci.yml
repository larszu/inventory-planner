name: CI

# Der Merge-Gate. Nach der stehenden Regel wird nur bei gruenem CI gemergt —
# ein Repo ohne Checks hat also kein Tor, sondern eine offene Tuer.
#
# Auf `pull_request`, weil genau dort gemergt wird. Nur auf `push: main` zu
# laufen hiesse, den Fehler nach dem Merge zu finden.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + Build
        run: npm run build
      - name: Tests
        run: npm test
      # ADR-006: Das Lager kennt kein Plan-Modell. Faellt diese Grenze, ist aus
      # zwei Werkzeugen wieder eines geworden — nur mit einer Repo-Grenze
      # dazwischen, die dann niemand mehr halten kann.
      - name: Grenze zum Plan
        run: npm run grenze:check
      # Quellsprache (E-17/E-20): dieses Repo ist deutsch-quellig, und das
      # steht nicht nur da, es wird gemessen.
      - name: Quellsprache — Fallbacks sind deutsch
        run: npm run lang:check
