name: CI

# Der Merge-Gate. Nach der stehenden Regel wird nur bei gruenem CI gemergt —
# ein Repo ohne Checks hat also kein Tor, sondern eine offene Tuer.
#
# Auf `pull_request`, weil genau dort gemergt wird. Nur auf einen Push zu
# laufen hiesse, den Fehler nach dem Merge zu finden.
#
# DER PUSH-ZWEIG NANNTE `main` — DER HIER NICHT DER DEFAULT-BRANCH IST
# (gemessen 2026-09-18). Es gibt drei Branches: `main`,
# `claude/av-planner-market-research-39l0mv` (der DEFAULT, also der, auf den
# gemergt wird) und den Arbeitsbranch. Ein Push auf den Default-Branch oder
# auf einen Arbeitsbranch loeste damit keinen Lauf aus.
#
# Aufgefallen ist es nicht, weil `pull_request` die Luecke verdeckte: solange
# ein PR offen war, prueften dessen `synchronize`-Laeufe jeden Push.
#
# Gemerkt hat es erst der Fall ohne offenen PR: gepusht am 2026-09-18 um
# 10:43, PR fuenf Minuten spaeter — dazwischen lag der Stand ungeprueft, und
# der erste Lauf musste von Hand angestossen werden.
#
# `**` statt einer Aufzaehlung: ein Branch-Name, der hier eingetragen werden
# muss, ist genau die Zeile, die beim naechsten Umbenennen wieder still
# danebenliegt. Ein Lauf zuviel kostet eine Minute; ein Lauf zuwenig kostet
# einen ungeprueften Stand.
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + Build
        run: npm run build
      # `npm test` faehrt die Waechter mit (vitest, Grenze zum Plan,
      # Quellsprache) — und zwar aus EINEM Grund: die Suite vendoriert dieses
      # Repo und ruft dort `npm run test --workspaces`. Ein Waechter, der nur
      # hier als eigener Workflow-Schritt staende, liefe in der vendorten Kopie
      # nie mit; ihr Workflow-Abbild feuert nicht. Der Waechter der Suite
      # (`ci:complete`) meldet genau das.
      - name: Tests + Waechter (Grenze zum Plan, Quellsprache)
        run: npm test
