name: Release

# Installer fuer Windows und macOS aus einem Tag — dieselbe Form wie im
# cable-planner, mit zwei bewussten Unterschieden, die weiter unten je an
# ihrer Stelle stehen (kein Universal-Merge, kein Auto-Update-Manifest).
#
# Ausgeloest von `v*`. `workflow_dispatch` baut ohne Tag und veroeffentlicht
# dann NICHT: die beiden hinteren Jobs haengen an `startsWith(github.ref,
# 'refs/tags/v')`. So laesst sich der Build pruefen, ohne ein Release
# anzulegen, das niemand wollte.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Kein fail-fast: bricht macOS ab, will man die fertige Windows-Datei
      # trotzdem sehen — sonst sucht man den Fehler in beiden Jobs.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: dist:win
          - os: macos-latest
            name: macos
            script: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version to tag
        # electron-builder liest `package.json.version` fuer den Dateinamen.
        # Ohne diesen Schritt hiesse die Datei zu einem Tag `v0.2.0` weiter
        # `…-0.1.0.exe` — und zwar ohne Fehlermeldung. `npm version
        # --no-git-tag-version` schreibt package.json + package-lock.json im
        # Runner, ohne Commit und ohne Tag; nach `main` zurueck schreibt der
        # Job `sync-version-to-main` ganz unten.
        # Bei `workflow_dispatch` (kein Tag) uebersprungen.
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag-Version: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Package with electron-builder
        # `shell: bash` auf JEDEM Betriebssystem, und das ist hier der Punkt.
        # Im cable-planner hat die Windows-Standardshell (pwsh) Ausgabe UND
        # Exit-Code von electron-builder verschluckt: der Schritt war nach
        # 1,5 s ohne eine Zeile Ausgabe "erfolgreich", und der Job scheiterte
        # erst beim Hochladen, weil release/*.exe nicht existierte. Git Bash
        # ist auf windows-latest vorinstalliert und reicht ein Nicht-Null
        # weiter.
        #
        # Aufgerufen wird `npm run dist:*` und nicht cli.js direkt: die
        # Builder-Argumente stehen damit an EINER Stelle (package.json) statt
        # zweimal. Zwei Stellen liefen sonst auseinander, und die Fassung im
        # Workflow ist die, die niemand lokal ausprobiert.
        #
        # Die electron-builder-Konfiguration liegt im `build`-Block der
        # package.json — kein `--config`-Flag noetig, weil es keine zweite
        # Konfigurationsdatei gibt, die stattdessen gefunden werden koennte.
        shell: bash
        env:
          # Keine gekaufte Signatur vorhanden. Der mac-Block fordert eine
          # Ad-hoc-Signatur (`identity: '-'`), damit Gatekeeper auf Apple
          # Silicon die Anwendung startet statt sie als "beschaedigt"
          # abzuweisen. CSC_IDENTITY_AUTO_DISCOVERY wird BEWUSST nicht auf
          # false gesetzt: in electron-builder 26 kuerzt dieses Flag die
          # explizite Ad-hoc-Identitaet ab, und heraus faellt ein voellig
          # unsigniertes Programm, das arm64-macOS gar nicht erst oeffnet.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }}

      - name: List release/ contents
        # Macht einen leeren Build im Protokoll sichtbar, bevor der naechste
        # Schritt ihn zum Fehler macht.
        shell: bash
        run: ls -lh release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: inventory-planner-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
          # Laut scheitern statt ein leeres Artefakt hochzuladen: sonst
          # entsteht ein Release, dem eine ganze Plattform fehlt, und die
          # Release-Seite sieht dabei aus wie jede andere.
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Release-Vollstaendigkeit pruefen
        # Der Fall, gegen den das geschrieben ist, ist im cable-planner
        # passiert: ein Release mit NULL Assets, fuenf Wochen lang unbemerkt.
        # `if-no-files-found: error` sichert je Job, dass IRGENDWAS da ist;
        # hier wird geprueft, dass JEDE Gattung da ist.
        #
        # UNTERSCHIED ZUM CABLE-PLANNER, UND ER IST ABSICHT: dort stehen hier
        # zusaetzlich `*.zip`, `latest.yml` und `latest-mac.yml`. Die braucht
        # dessen eingebauter Auto-Updater. Dieses Werkzeug hat keinen — eine
        # Zeile fuer eine Datei, die niemand baut und niemand liest, waere ein
        # Dauer-Fehlalarm und entwertete die beiden Zeilen, auf die es ankommt.
        # Kommt hier je ein Updater dazu, kommen die drei Zeilen mit ihm.
        shell: bash
        run: |
          set -eu
          echo "--- heruntergeladene Artefakte ---"
          find artifacts -type f | sort
          echo "----------------------------------"
          fehlt=0
          pruefe() {
            anzahl="$(find artifacts -type f -name "$1" | wc -l | tr -d ' ')"
            if [ "$anzahl" -ge "$2" ]; then
              echo "ok   $1 ($anzahl, erwartet mindestens $2)"
            else
              echo "FEHLT $1 -- $3 (gefunden: $anzahl, erwartet mindestens $2)"
              fehlt=1
            fi
          }
          pruefe '*.exe' 2 'Windows: Setup UND Portable (windows-Job)'
          # Zwei DMGs, nicht eines: der mac-Block baut x64 und arm64 getrennt,
          # statt sie zu einem Universal-Paket zu verschmelzen. Genau dieser
          # Merge-Schritt ist im cable-planner abgebrochen und hat das leere
          # Release verursacht. Zwei Dateien sind ein Download mehr fuer den
          # Nutzer und ein Ausfallgrund weniger.
          pruefe '*.dmg' 2 'macOS: je ein DMG fuer Intel und Apple Silicon (macos-Job)'
          if [ "$fehlt" -ne 0 ]; then
            echo
            echo "Ein halbes Release ist schlimmer als keines: es sieht auf der"
            echo "Release-Seite vollstaendig aus. Erst den fehlenden Build-Job"
            echo "reparieren, dann den Tag neu setzen."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Die Tag-Version zurueck nach main schreiben. Der Build-Job setzt sie nur im
  # Runner (fuer den Dateinamen); ohne diesen Job bliebe package.json auf dem
  # alten Stand, und die naechste Fassung baute auf einer Zahl auf, die nie
  # veroeffentlicht wurde. Genau diese Drift (package.json 8.0.10 waehrend
  # v8.2.0 schon draussen war) hat im cable-planner eine Doku-Korrektur
  # ausgeloest.
  #
  # Pushes mit GITHUB_TOKEN loesen bewusst KEINE weiteren Workflows aus (kein
  # Loop). Setzt voraus, dass main direkte Bot-Pushes erlaubt — bei
  # Branch-Protection braucht github-actions[bot] eine Ausnahme.
  sync-version-to-main:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: package.json auf Tag-Version setzen und nach main committen
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag-Version: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          if git diff --quiet -- package.json package-lock.json; then
            echo "package.json ist bereits auf $TAG_VERSION — nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): package.json auf v$TAG_VERSION (Tag-Sync)"
          git pull --rebase origin main
          git push origin HEAD:main
